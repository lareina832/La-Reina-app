<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA REINA 832</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#12001f,#320052);
 color:white;
}

header{
 text-align:center;
 padding:22px 10px;
 background:#170024;
 border-bottom:2px solid #d4af37;
}

.logo{
 font-size:30px;
 font-weight:bold;
 color:#ffd84d;
}

.sub{
 margin-top:5px;
 color:#e7cb72;
}

main{
 max-width:650px;
 margin:auto;
 padding:15px;
}

.card{
 background:#210335;
 border:1px solid #754b8c;
 border-radius:18px;
 padding:18px;
 margin-bottom:18px;
}

h1,h2,h3{
 color:#ffd84d;
}

label{
 display:block;
 margin-top:12px;
 margin-bottom:5px;
 font-weight:bold;
}

input{
 width:100%;
 padding:14px;
 border:0;
 border-radius:10px;
 font-size:18px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
}

.btnop{
 background:#391052;
 color:white;
 border:1px solid #80539b;
 border-radius:10px;
 padding:13px 5px;
 font-weight:bold;
 text-align:center;
 cursor:pointer;
}

.btnop.activo{
 background:#d4af37;
 color:#180020;
}

.numero{
 font-size:25px;
 text-align:center;
}

.jugada{
 background:#15001f;
 border:1px solid #5d3473;
 border-radius:15px;
 padding:15px;
 margin-top:15px;
}

.oculto{
 display:none;
}

.monto{
 margin-top:10px;
}

.acciones{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-top:15px;
}

button{
 border:0;
 border-radius:12px;
 padding:13px 15px;
 font-weight:bold;
 cursor:pointer;
}

.principal{
 background:#d4af37;
 color:#16001f;
}

.secundario{
 background:#54206f;
 color:white;
}

.comprobante{
 background:#050008;
 border:1px solid #d4af37;
 border-radius:12px;
 padding:15px;
 white-space:pre-wrap;
 font-family:monospace;
 font-size:14px;
 line-height:1.5;
 overflow:auto;
}

.whatsapp{
 position:fixed;
 right:18px;
 bottom:18px;
 width:58px;
 height:58px;
 border-radius:50%;
 background:#25d366;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 text-decoration:none;
 font-size:28px;
}

@media(max-width:500px){
 .grid{
  grid-template-columns:1fr 1fr;
 }
}
</style>
</head>

<body>

<header>
 <div class="logo">👑 LA REINA 832</div>
 <div class="sub">QUINIELA ONLINE</div>
</header>

<main>

<div class="card">

<h1>🎟️ CARGAR JUGADA</h1>

<h3>1️⃣ ELEGÍ EL SORTEO</h3>

<div class="grid" id="sorteos">

<div class="btnop" onclick="sorteo(this,'PREVIA')">PREVIA</div>
<div class="btnop" onclick="sorteo(this,'PRIMERA')">PRIMERA</div>
<div class="btnop" onclick="sorteo(this,'MATUTINA')">MATUTINA</div>
<div class="btnop" onclick="sorteo(this,'VESPERTINA')">VESPERTINA</div>
<div class="btnop" onclick="sorteo(this,'NOCTURNA')">NOCTURNA</div>

</div>

<div id="jugadas"></div>

<div class="acciones">
<button class="principal" onclick="agregar()">
➕ AGREGAR NÚMERO
</button>

<button class="principal" onclick="comprobante()">
🧾 VER COMPROBANTE
</button>
</div>

</div>


<div class="card">

<h2>🧾 COMPROBANTE</h2>

<div id="ticket" class="comprobante">
Cargá tu jugada para ver el comprobante.
</div>

<br>

<button class="principal" onclick="enviar()">
📲 ENVIAR POR WHATSAPP
</button>

</div>

</main>


<a class="whatsapp"
href="https://wa.me/543517682897"
target="_blank">
☏
</a>


<script>

let sorteoElegido="";
let cantidad=0;
let ticketTexto="";


const quinielas=[
"NACIONAL",
"PROVINCIA",
"SANTA FE",
"CÓRDOBA",
"ENTRE RÍOS",
"MENDOZA",
"CORRIENTES",
"CHACO",
"CATAMARCA",
"CHUBUT",
"FORMOSA",
"JUJUY",
"LA RIOJA",
"MISIONES",
"PARAGUAY",
"RÍO NEGRO",
"SAN LUIS",
"SANTIAGO",
"TUCUMÁN",
"MONTEVIDEO",
"URUGUAY"
];


function sorteo(btn,nombre){

 document.querySelectorAll("#sorteos .btnop")
 .forEach(x=>x.classList.remove("activo"));

 btn.classList.add("activo");

 sorteoElegido=nombre;
}


function agregar(){

 cantidad++;

 let html=`

 <div class="jugada" id="j${cantidad}">

 <h2>🎟️ JUGADA ${cantidad}</h2>

 <label>NÚMERO</label>

 <input
 class="numero"
 type="text"
 inputmode="numeric"
 maxlength="4"
 placeholder="Ej: 32"
 oninput="this.value=this.value.replace(/\\D/g,'')">


 <label>MODALIDAD</label>

 <div class="grid">

 <div class="btnop"
 onclick="modalidad(this,'cabeza')">
 👑 A LA CABEZA
 </div>

 <div class="btnop"
 onclick="modalidad(this,'premios')">
 🏆 A LOS PREMIOS
 </div>

 <div class="btnop"
 onclick="modalidad(this,'redoblona')">
 🔥 REDOBLONA
 </div>

 </div>


 <input
 type="hidden"
 class="tipo">


 <div class="premios oculto">

 <label>¿HASTA QUÉ PREMIO?</label>

 <div class="grid">

 <div class="btnop"
 onclick="premio(this,5)">
 5
 </div>

 <div class="btnop"
 onclick="premio(this,10)">
 10
 </div>

 <div class="btnop"
 onclick="premio(this,20)">
 20
 </div>

 </div>

 <input type="hidden" class="hasta">

 </div>


 <div class="redoblona oculto">

 <label>SEGUNDO NÚMERO</label>

 <input
 class="segundo"
 type="text"
 inputmode="numeric"
 maxlength="4"
 placeholder="Ej: 15"
 oninput="this.value=this.value.replace(/\\D/g,'')">


 <label>POSICIÓN PRIMER NÚMERO</label>

 <div class="grid posiciones1">

 <div class="btnop activo"
 onclick="posicion(this,'p1','1')">
 01
 </div>

 <div class="btnop"
 onclick="posicion(this,'p1','5')">
 05
 </div>

 <div class="btnop"
 onclick="posicion(this,'p1','10')">
 10
 </div>

 <div class="btnop"
 onclick="posicion(this,'p1','20')">
 20
 </div>

 </div>


 <label>POSICIÓN SEGUNDO NÚMERO</label>

 <div class="grid posiciones2">

 <div class="btnop activo"
 onclick="posicion(this,'p2','1')">
 01
 </div>

 <div class="btnop"
 onclick="posicion(this,'p2','5')">
 05
 </div>

 <div class="btnop"
 onclick="posicion(this,'p2','10')">
 10
 </div>

 <div class="btnop"
 onclick="posicion(this,'p2','20')">
 20
 </div>

 </div>

 <input type="hidden" class="p1" value="1">
 <input type="hidden" class="p2" value="1">

 </div>


 <label>QUINIELAS</label>

 <div class="grid">

 ${quinielas.map(q=>`
 <div
 class="btnop quiniela"
 onclick="this.classList.toggle('activo')">
 ${q}
 </div>
 `).join("")}

 </div>


 <label>MONTO</label>

 <input
 class="monto"
 type="number"
 placeholder="$ Monto">


 <div class="acciones">

 <button
 class="secundario"
 onclick="todas(this)">
 ✅ TODAS
 </button>

 <button
 class="secundario"
 onclick="borrar(this)">
 🗑️ ELIMINAR
 </button>

 </div>

 </div>
 `;

 document
 .getElementById("jugadas")
 .insertAdjacentHTML("beforeend",html);
}


function modalidad(btn,tipo){

 let card=btn.closest(".jugada");

 card.querySelectorAll(".grid .btnop")
 .forEach(x=>{
  if(
   x.textContent.includes("CABEZA")||
   x.textContent.includes("PREMIOS")||
   x.textContent.includes("REDOBLONA")
  ){
   x.classList.remove("activo");
  }
 });

 btn.classList.add("activo");

 card.querySelector(".tipo").value=tipo;

 card.querySelector(".premios")
 .classList.toggle("oculto",tipo!=="premios");

 card.querySelector(".redoblona")
 .classList.toggle("oculto",tipo!=="redoblona");
}


function premio(btn,valor){

 let box=btn.parentElement;

 box.querySelectorAll(".btnop")
 .forEach(x=>x.classList.remove("activo"));

 btn.classList.add("activo");

 btn.closest(".premios")
 .querySelector(".hasta").value=valor;
}


function posicion(btn,tipo,valor){

 let box=btn.parentElement;

 box.querySelectorAll(".btnop")
 .forEach(x=>x.classList.remove("activo"));

 btn.classList.add("activo");

 btn.closest(".redoblona")
 .querySelector("."+tipo).value=valor;
}


function todas(btn){

 let card=btn.closest(".jugada");

 card.querySelectorAll(".quiniela")
 .forEach(x=>x.classList.add("activo"));
}


function borrar(btn){

 let cards=document.querySelectorAll(".jugada");

 if(cards.length===1){

  alert("Debe quedar al menos una jugada.");
  return;
 }

 btn.closest(".jugada").remove();
}


function formatoNumero(n){

 return String(n).padStart(4,"0");
}


function comprobante(){

 if(!sorteoElegido){

  alert("Elegí primero el sorteo.");
  return;
 }

 let cards=document.querySelectorAll(".jugada");

 let texto="";

 let ahora=new Date();

 let fecha=ahora.toLocaleDateString("es-AR");

 let hora=ahora.toLocaleTimeString(
 "es-AR",
 {
  hour:"2-digit",
  minute:"2-digit"
 }
 );

 texto+="FECHA/HORA: "+fecha+" "+hora+"\n";

 texto+="*** "+sorteoElegido+" ***\n";

 texto+="*** 💋 LA REINA 832💋 ***\n";

 texto+="==========================\n";

 texto+="SEC: --------\n";

 texto+="PRIMERA: NQ\n";

 let total=0;

 let error=false;


 cards.forEach(card=>{

  let numero=
  card.querySelector(".numero").value.trim();

  let tipo=
  card.querySelector(".tipo").value;

  let monto=
  Number(card.querySelector(".monto").value);

  let seleccionadas=
  [...card.querySelectorAll(".quiniela.activo")]
  .map(x=>x.textContent.trim());


  if(
   !numero||
   !tipo||
   !monto||
   seleccionadas.length===0
  ){

   error=true;
   return;
  }


  if(tipo==="cabeza"){

   seleccionadas.forEach(q=>{

    texto+=
    formatoNumero(numero)+
    " - 01 | $"+
    monto+
    "\n";

   });

   total+=
   monto*seleccionadas.length;
  }


  if(tipo==="premios"){

   let hasta=
   card.querySelector(".hasta").value;

   if(!hasta){

    error=true;
    return;
   }


   seleccionadas.forEach(q=>{

    texto+=
    formatoNumero(numero)+
    " - "+
    String(hasta).padStart(2,"0")+
    " | $"+
    monto+
    "\n";

   });

   total+=
   monto*seleccionadas.length;
  }


  if(tipo==="redoblona"){

   let segundo=
   card.querySelector(".segundo").value.trim();

   let p1=
   card.querySelector(".p1").value;

   let p2=
   card.querySelector(".p2").value;


   if(!segundo){

    error=true;
    return;
   }


   texto+="REDOBLONA\n";

   texto+=
   numero+
   " - "+
   String(p1).padStart(2,"0")+
   " |\n";

   texto+=
   segundo+
   " - "+
   String(p2).padStart(2,"0")+
   " | $"+
   monto+
   "\n";

   total+=monto;
  }

 });


 if(error){

  alert(
   "Revisá que todas las jugadas tengan número, modalidad, quiniela y monto."
  );

  return;
 }


 texto+="TOTAL: $"+total+"\n";

 texto+="--------------------------\n";

 texto+="GRACIAS POR SU JUGADA";


 ticketTexto=texto;

 document.getElementById("ticket")
 .textContent=texto;

}


function enviar(){

 comprobante();

 if(!ticketTexto){

  return;
 }

 let url=
 "https://wa.me/543517682897?text="+
 encodeURIComponent(ticketTexto);

 window.open(url,"_blank");
}


agregar();

</script>

</body>
 </html>
